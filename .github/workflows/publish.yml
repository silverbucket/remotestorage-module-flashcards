name: Publish

on:
    push:
        tags: ["v*"]

permissions:
    contents: read
    id-token: write # npm trusted publishing and provenance

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.4.4
            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  registry-url: https://registry.npmjs.org
            - name: Check tag matches package.json version
              run: |
                  version="v$(node -p 'require("./package.json").version')"
                  if [ "$version" != "$GITHUB_REF_NAME" ]; then
                    echo "Tag $GITHUB_REF_NAME does not match package.json $version"
                    exit 1
                  fi
            - run: bun install --frozen-lockfile
            # prepublishOnly runs typecheck, tests, and build.
            - run: npm publish --provenance --access public
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
